{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}<span>Change Password</span>{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="page-heading">Change Password</h2>
    <p class="page-subtitle">Update your account password</p>
</div>

<div class="card card-narrow">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="old_password">Current Password</label>
                <input type="password" name="old_password" id="old_password" class="form-control" placeholder="Enter current password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" class="form-control" placeholder="At least 8 characters" required>
                <small class="help-text">Use at least 8 characters with a mix of letters and numbers.</small>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter new password" required>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
