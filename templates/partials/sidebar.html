<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-book-open"></i>
        <span class="brand-text">Library Management System</span>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section">Main</span>
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="fas fa-th-large"></i><span>Dashboard</span>
        </a>

        <span class="nav-section">Catalog</span>
        <a href="{% url 'book_list' %}" class="nav-link {% if 'book' in request.resolver_match.url_name and request.resolver_match.url_name != 'book' %}active{% endif %}">
            <i class="fas fa-book"></i><span>Books</span>
        </a>
        <a href="{% url 'category_list' %}" class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
            <i class="fas fa-tags"></i><span>Categories</span>
        </a>
        <a href="{% url 'author_list' %}" class="nav-link {% if 'author' in request.resolver_match.url_name %}active{% endif %}">
            <i class="fas fa-user-pen"></i><span>Authors</span>
        </a>
        <a href="{% url 'publisher_list' %}" class="nav-link {% if 'publisher' in request.resolver_match.url_name %}active{% endif %}">
            <i class="fas fa-building"></i><span>Publishers</span>
        </a>

        <span class="nav-section">Borrowing</span>
        <a href="{% url 'issue_book' %}" class="nav-link {% if request.resolver_match.url_name == 'issue_book' %}active{% endif %}">
            <i class="fas fa-basket-shopping"></i><span>Borrow Book</span>
        </a>
        <a href="{% url 'return_book' %}" class="nav-link {% if request.resolver_match.url_name == 'return_book' %}active{% endif %}">
            <i class="fas fa-rotate-left"></i><span>Return Book</span>
        </a>
        <a href="{% url 'borrowing_history' %}" class="nav-link {% if request.resolver_match.url_name == 'borrowing_history' %}active{% endif %}">
            <i class="fas fa-clock-rotate-left"></i><span>My Borrowings</span>
        </a>

        {% if user.is_staff or user.is_superuser %}
        <a href="{% url 'member_list' %}" class="nav-link {% if request.resolver_match.url_name == 'member_list' %}active{% endif %}">
            <i class="fas fa-users"></i><span>Members</span>
        </a>
        <a href="{% url 'reports' %}" class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
            <i class="fas fa-chart-pie"></i><span>Reports</span>
        </a>
        {% endif %}

        <span class="nav-section">Account</span>
        <a href="{% url 'wishlist' %}" class="nav-link {% if request.resolver_match.url_name == 'wishlist' %}active{% endif %}">
            <i class="fas fa-heart"></i><span>Wishlist</span>
        </a>
        <a href="{% url 'profile' %}" class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <i class="fas fa-user-circle"></i><span>Profile</span>
        </a>
        <a href="{% url 'change_password' %}" class="nav-link {% if request.resolver_match.url_name == 'change_password' %}active{% endif %}">
            <i class="fas fa-key"></i><span>Change Password</span>
        </a>
        {% if user.is_superuser %}
        <a href="/admin/" class="nav-link" target="_blank">
            <i class="fas fa-shield-halved"></i><span>Django Admin</span>
        </a>
        {% endif %}
    </nav>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
