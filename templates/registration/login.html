{% extends 'base.html' %}
{% load static %}
{% block title %}Login{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-book-open"></i></div>
            <h2>Welcome Back</h2>
            <p>Log in to your library account</p>
        </div>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">
                <span class="alert-icon"><i class="fas fa-exclamation-circle"></i></span>
                <span class="alert-text">{{ form.non_field_errors }}</span>
            </div>
            {% endif %}
            <div class="form-group">
                <label for="id_username"><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In <i class="fas fa-arrow-right"></i></button>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
