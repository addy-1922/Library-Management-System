databases:
  - name: library-db
    databaseName: library
    user: library
    plan: free
    region: singapore

services:
  - type: web
    name: library-management-system
    runtime: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://library-management-system.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: WEB_CONCURRENCY
        value: "2"
